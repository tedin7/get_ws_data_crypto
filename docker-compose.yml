# Docker Compose configuration for the public Bybit websocket app (app) and data archiver (archiver).
version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-u", "main.py"]
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1280m
    volumes:
      - .:/app
      - ./ws_data:/app/ws_data
    environment:
      WS_DIR_PATH: /app/ws_data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  archiver:
    build:
      context: .
      dockerfile: Dockerfile.archiver
    working_dir: /app
    volumes:
      - ./:/app
      - ./ws_data:/app/ws_data
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: "UTC"
      WS_DIR_PATH: /app/ws_data
    command: ["python", "-u", "archiver.py"]
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1280m
